name: aisupport-prod

# Production topology only. Do not use for local development.
# Distinct project/network/volume names so this stack cannot reuse or
# overwrite the local `aisupport` Compose resources if both files are
# ever started on one host.
# Start with:
#   sudo docker compose --env-file .env.production -f compose.production.yml up -d --build

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - aisupport

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Ephemeral by design: no volume. Recreating this container discards
    # queued Celery jobs and task results. Acceptable while Redis is only
    # the diagnostic-worker broker/result backend, not durable product state.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks:
      - aisupport

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api
    networks:
      - aisupport

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    command: celery -A app.core.celery:celery_app worker --loglevel=info
    networks:
      - aisupport

  web:
    build:
      context: ./apps/web
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    networks:
      - aisupport

networks:
  aisupport:
    name: aisupport-prod

volumes:
  postgres_data:
    name: aisupport-prod_postgres_data
